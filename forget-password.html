<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>إعادة ضبط كلمة المرور</title>
        <link rel="icon" href="imgs/logo.webp"/>
        <link rel="stylesheet" href="css/bootstrap.rtl.css"/>
        <link rel="stylesheet" href="css/bootstrap.rtl.min.css"/>
        <link rel="stylesheet" href="css/css/all.min.css"/>
        <link rel="stylesheet" href="css/css/all.css"/>
        <link rel="stylesheet" href="css/main.css"/>
    </head>
    <body>
        <nav class="navbar login-navbar navbar-expand-lg p-0 middle-menu position-relative">
            <div class="container position-relative py-1">
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <img src="imgs/logo.webp" alt="شعار مسابقات الرماية السنوية" class="logo"/>
                    <p class="mb-0 ps-2">
                        <span class="d-block">مسابقات الرماية السنوية</span>
                        <span>Annual Shooting Competitions</span>
                    </p>
                </a>
            </div>
        </nav>
        
        <main class="forget-pass-pg position-relative d-flex justify-content-center align-items-center">
            <div class="register-img position-absolute"></div>
            <div class="container">
                <div class="register-header row mb-3">
                    <div class="breadcrumb d-flex align-items-center col-12 col-lg-4 mb-0">
                        <a href="index.html">
                            <i class="fa-solid fa-house fa-lg"></i>
                            الرئيسية</a>
                        <i class="fa-solid fa-angle-left fa-xs mt-1 d-md-none"></i>
                        <i class="fa-solid fa-angle-left fa-sm mt-1 d-none d-md-block"></i>
                        <button class="border-0 bg-transparent">إعادة ضبط كلمة المرور</button>
                    </div>
                    <div class="heading text-center col-12 col-lg-8">
                        <h2 class="fw-bold position-relative mb-0">إعادة ضبط كلمة المرور</h2>
                        <svg width="270" height="24" viewBox="0 0 270 24" xmlns="http://www.w3.org/2000/svg">
                            <rect x="0" y="11" width="250" height="2" rx="1" fill="#ab7037"/>
                            <rect x="250" y="7" width="20" height="10" rx="2" fill="#ab7037"/>
                        </svg>
                    </div>
                </div>
                <form class="forget-pass-form d-flex py-4 flex-column flex-md-row">
                    <div class="position-relative">
                        <label for="exampleInputEmail1" class="form-label">البريد الإلكتروني</label>
                        <input type="email" class="login-email-input form-control text-start" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="example@email.com" required autocomplete="email">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#c19870" class="bi bi-envelope-fill input-icon position-absolute" viewBox="0 0 16 16">
                            <path d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414zM0 4.697v7.104l5.803-3.558zM6.761 8.83l-6.57 4.027A2 2 0 0 0 2 14h12a2 2 0 0 0 1.808-1.144l-6.57-4.027L8 9.586zm3.436-.586L16 11.801V4.697z"/>
                        </svg>
                    </div>
                    <button type="submit" class="btn main-btn submit-btn d-block fw-bold overflow-hidden"><span>إرسال كود التحقيق</span></button>
                </form>
            </div>
        </main>

        <script src="js/bootstrap.bundle.min.js"></script>
        <script src="js/components/navbar.js"></script>
        <script src="js/components/footer.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
