<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>تسجيل الدخول</title>
        <link rel="icon" href="imgs/logo.webp"/>
        <link rel="stylesheet" href="css/bootstrap.rtl.css"/>
        <link rel="stylesheet" href="css/bootstrap.rtl.min.css"/>
        <link rel="stylesheet" href="css/css/all.min.css"/>
        <link rel="stylesheet" href="css/css/all.css"/>
        <link rel="stylesheet" href="css/main.css"/>
    </head>
    <body>
        <app-navbar></app-navbar>

        <main class="login-pg position-relative d-flex justify-content-center align-items-center">
            <div class="register-img position-absolute"></div>
            <div class="container">
                <div class="register-header row mb-3">
                    <div class="breadcrumb d-flex align-items-center col-12 col-lg-4 mb-0">
                        <a href="index.html">
                            <i class="fa-solid fa-house fa-lg"></i>
                            الرئيسية</a>
                        <i class="fa-solid fa-angle-left fa-xs mt-1 d-md-none"></i>
                        <i class="fa-solid fa-angle-left fa-sm mt-1 d-none d-md-block"></i>
                        <button class="border-0 bg-transparent">تسجيل الدخول</button>
                    </div>
                    <div class="heading text-center col-12 col-lg-8">
                        <h2 class="fw-bold position-relative mb-0">تسجيل الدخول</h2>
                        <svg width="270" height="24" viewBox="0 0 270 24" xmlns="http://www.w3.org/2000/svg">
                            <rect x="40" y="11" width="180" height="2" rx="1" fill="#ab7037"/>
                            <rect x="220" y="7" width="20" height="10" rx="2" fill="#ab7037"/>
                        </svg>
                    </div>
                </div>
                <div class="login-form row position-relative">
                    <div class="right-side col-12 col-md-6 text-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" fill="#ab7037b3" class="bi bi-person-circle mb-3" viewBox="0 0 16 16">
                            <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                            <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
                        </svg>
                        <form class="text-start">
                            <div class="mb-3 position-relative">
                                <label for="login-email" class="form-label">البريد الإلكتروني</label>
                                <input type="email" class="login-email-input form-control text-start" id="login-email" aria-describedby="emailHelp" placeholder="example@email.com" required autocomplete="email">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#c19870" class="bi bi-envelope-fill input-icon position-absolute" viewBox="0 0 16 16">
                                    <path d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414zM0 4.697v7.104l5.803-3.558zM6.761 8.83l-6.57 4.027A2 2 0 0 0 2 14h12a2 2 0 0 0 1.808-1.144l-6.57-4.027L8 9.586zm3.436-.586L16 11.801V4.697z"/>
                                </svg>
                            </div>
                            <div class="position-relative">
                                <label for="login-password" class="form-label">كلمة المرور</label>
                                <input type="password" class="login-pass-input form-control" id="login-password" placeholder="••••••••" required autocomplete="current-password" minlength="8" maxlength="100">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#c19870" class="bi bi-lock-fill input-icon position-absolute" viewBox="0 0 16 16">
                                    <path fill-rule="evenodd" d="M8 0a4 4 0 0 1 4 4v2.05a2.5 2.5 0 0 1 2 2.45v5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 13.5v-5a2.5 2.5 0 0 1 2-2.45V4a4 4 0 0 1 4-4m0 1a3 3 0 0 0-3 3v2h6V4a3 3 0 0 0-3-3"/>
                                </svg>
                                <button type="button" class="show-pass-btn position-absolute border-0 bg-transparent">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye-fill show-pass-icon " viewBox="0 0 16 16">
                                        <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/>
                                        <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8m8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"/>
                                    </svg>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye-slash-fill hide-pass-icon d-none"  viewBox="0 0 16 16">
                                        <path d="m10.79 12.912-1.614-1.615a3.5 3.5 0 0 1-4.474-4.474l-2.06-2.06C.938 6.278 0 8 0 8s3 5.5 8 5.5a7 7 0 0 0 2.79-.588M5.21 3.088A7 7 0 0 1 8 2.5c5 0 8 5.5 8 5.5s-.939 1.721-2.641 3.238l-2.062-2.062a3.5 3.5 0 0 0-4.474-4.474z"/>
                                        <path d="M5.525 7.646a2.5 2.5 0 0 0 2.829 2.829zm4.95.708-2.829-2.83a2.5 2.5 0 0 1 2.829 2.829zm3.171 6-12-12 .708-.708 12 12z"/>
                                    </svg>
                                </button>
                            </div>
                            <div class="d-flex justify-content-between align-items-center flex-wrap">
                                <span class="mt-1 ms-3"><a href="forget-password.html" class="forget-pass">هل نسيت كلمة المرور ؟</a></span>
                                <span class="mt-1 me-3"><a href="forget-password.html" class="forget-pass text-decoration-underline">إنشاء حساب جديد</a></span>
                            </div>
                            <button type="submit" class="btn main-btn submit-btn d-block mx-auto mt-4 fw-bold overflow-hidden"><span>تسجيل الدخول</span></button>
                        </form>
                    </div>
                    <div class="left-side col-12 col-md-6 d-none d-md-flex p-0 position-relative d-flex justify-content-center align-items-center fw-bold text-center text-white">
                        <p class="position-relative z-4 mb-0">مرحبًا بكم في مسابقات الرماية السنوية<br/>حيث تتجسّد الدقة والانتماء</p>
                    </div>
                </div>
            </div>
        </main>

        <app-footer></app-footer>

        <script src="js/bootstrap.bundle.min.js"></script>
        <script src="js/gsap.min.js"></script>
        <script src="js/components/navbar.js"></script>
        <script src="js/components/footer.js"></script>
        <script src="js/login.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
